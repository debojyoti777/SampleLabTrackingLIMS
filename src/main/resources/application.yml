server:
  port: 8080

spring:
  application:
    name: sample-tracking-api

  datasource:
    # Local dev default. For RDS, override these three via env vars
    # (or a separate application-prod.yml) — never hardcode RDS creds here.
    url: ${DB_URL:jdbc:mysql://localhost:3306/sampletracking}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' is fine for local dev; switch to 'validate' once you
      # introduce a migration tool (Flyway/Liquibase) for RDS.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
